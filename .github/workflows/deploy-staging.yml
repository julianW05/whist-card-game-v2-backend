name: "Deploy staging"
on:
  push:
    branches:
      - development
  workflow_dispatch:

jobs:

  deploy-staging:
    name: "Deploy staging"
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v6

      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: "Setup SSH key"
        run: |
          mkdir "${HOME}/.ssh/"
          chmod 700 "${HOME}/.ssh/"
          echo "${{ secrets.SSH_KEY }}" > "${HOME}/.ssh/id_rsa"
          chmod 600 "${HOME}/.ssh/id_rsa"

      - name: "Install Dependencies"
        run: |
          composer install
          npm install

      - name: "Build Vite Assets"
        run: |
          npm run build

      - name: "Upload repository"
        run: |
          rsync -az -e "ssh -o StrictHostKeyChecking=no" --delete-after \
            --exclude '.env' --exclude '.git' --exclude 'node_modules' \
            --exclude 'storage' --exclude 'public/storage' \
            . "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.DEPLOY_DIRECTORY }}"
      - name: "Deploy"
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'bash -lc "
            set -e
            cd \"${{ vars.DEPLOY_DIRECTORY }}\"

            php8.5 -v
            php8.5 /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction

            php8.5 artisan migrate --force

            php8.5 artisan optimize:clear
            php8.5 artisan config:cache
            php8.5 artisan route:cache
            php8.5 artisan view:cache

            php8.5 artisan horizon:terminate
          "'
